name: Fetch X Followers Count

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          echo "X_BEARER_TOKEN=${{ secrets.X_BEARER_TOKEN }}" >> .env.local
          echo "NEXT_PUBLIC_X_HANDLE=${{ secrets.NEXT_PUBLIC_X_HANDLE }}" >> .env.local

      - name: Run fetch script
        run: npx dotenv-cli -e .env.local -- node scripts/fetch_x_followers.js

      - name: Cleanup
        if: always()
        run: rm -f .env.local
