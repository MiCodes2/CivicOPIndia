name: Fetch X Followers Count

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install  # Changed from 'ci' to 'install' to prevent lockfile errors

      - name: Run fetch script
        env:
          # Directly map secrets to environment variables
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NEXT_PUBLIC_X_HANDLE: ${{ secrets.NEXT_PUBLIC_X_HANDLE }}
        # Run node directly. No 'dotenv-cli' needed.
        run: node scripts/fetch_x_followers.js
